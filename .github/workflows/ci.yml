# Revisión automática de Oficio.
# Corre en cada push a main o develop y en cada pull request. Si algo falla, GitHub marca el
# commit con una ✗ roja y te dice en qué paso.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Si subes dos cambios seguidos, cancela la revisión vieja y corre solo la nueva
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · compila sin errores
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  app-movil:
    name: App móvil · compila y se empaqueta para iPhone
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    env:
      # Valores de mentira: aquí solo se revisa que la app compile, no se conecta a nada
      EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: solo-para-ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      # Errores de TypeScript, incluidos nombres de columnas que no existen en la base
      - run: npm run typecheck
      # Empaqueta la app como lo haría para el iPhone: detecta imports rotos y errores de Babel/NativeWind
      - run: npm run export:ios

  base-y-flujo:
    name: Base · migraciones, tipos y flujo completo
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/api/package-lock.json

      # Misma versión de la CLI que usas en tu computadora (viene del package-lock)
      - name: Instalar la CLI de Supabase
        run: npm ci

      # Levanta una base limpia y aplica TODAS las migraciones + seed.
      # Si una migración o supabase/config.toml tienen un error, falla aquí.
      # Mailpit se queda encendido: "npm run acceso" lee ahí los códigos de los correos.
      - name: Levantar Supabase (migraciones y seed)
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime

      # Si cambiaste una migración y olvidaste regenerar los tipos, falla aquí.
      - name: Los tipos de TypeScript están al día
        run: |
          npx supabase gen types typescript --local > /tmp/database.ts
          if ! diff -q packages/shared/src/types/database.ts /tmp/database.ts > /dev/null; then
            echo "::error file=packages/shared/src/types/database.ts::Los tipos no coinciden con las migraciones. Corre 'npm run db:types' con Supabase encendido y haz commit del archivo."
            diff -u packages/shared/src/types/database.ts /tmp/database.ts | head -60
            exit 1
          fi

      - name: Crear el .env de la API (llaves del Supabase de prueba)
        run: |
          eval "$(npx supabase status -o env 2>/dev/null | grep -E '^[A-Z0-9_]+=')"
          {
            echo "SUPABASE_URL=http://127.0.0.1:54321"
            echo "SUPABASE_ANON_KEY=${ANON_KEY:-$PUBLISHABLE_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY:-$SECRET_KEY}"
            echo "CRON_SECRET=solo-para-pruebas-en-ci-0000"
            echo "PORT=8080"
          } > apps/api/.env

      - name: Instalar dependencias de la API
        working-directory: apps/api
        run: npm ci

      - name: Crear usuarios de prueba
        working-directory: apps/api
        run: npm run demo

      # Sprint 1: registro con teléfono y correo, entrar y recuperar la contraseña (25 comprobaciones)
      - name: Comprobar el acceso
        working-directory: apps/api
        run: npm run acceso

      # Sprint 2: alta de prestador, documentos en Storage y quién ve qué (34 comprobaciones)
      - name: Comprobar el alta de prestador
        working-directory: apps/api
        run: npm run alta

      # Sprint 3A: buscar prestadores, su perfil, favoritos, direcciones y enviar solicitudes (39 comprobaciones)
      - name: Comprobar búsqueda y solicitudes
        working-directory: apps/api
        run: npm run busqueda

      # Sprint 3B: bandeja del prestador, detalle con fotos y video, cotizar, rechazar, confirmar, terminar y reseñas (46 comprobaciones)
      - name: Comprobar respuestas y reseñas
        working-directory: apps/api
        run: npm run respuestas

      # Sprint 4A: seguimiento del cliente, cancelar con motivo, bloqueos con repetición y calendario (24 comprobaciones)
      - name: Comprobar seguimiento y calendario
        working-directory: apps/api
        run: npm run seguimiento

      # Sprint 4B: chat, leídos, archivos privados, cola de avisos y su envío con un Expo de mentira (44 comprobaciones).
      # Va antes de arrancar la API: con la API prendida, su envío de avisos se cruzaría con la prueba.
      - name: Comprobar chat y avisos
        working-directory: apps/api
        run: npm run chat

      # Sprint 5A: búsqueda por significado y asistente de solicitud, con un Claude y un Voyage
      # de mentira (no usa llaves reales ni sale a internet). 42 comprobaciones
      - name: Comprobar la IA (búsqueda y asistente)
        working-directory: apps/api
        run: npm run ia

      # Las mismas 16 comprobaciones que corriste en el paso 9
      - name: Arrancar la API y recorrer el flujo completo
        working-directory: apps/api
        run: |
          npx tsx --env-file=.env src/index.ts > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health > /dev/null && break
            sleep 1
          done
          npm run flujo || { echo "---- log de la API ----"; cat /tmp/api.log; exit 1; }
